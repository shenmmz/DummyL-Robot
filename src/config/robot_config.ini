[serial]
port = COM4
baudrate = 115200
[tool]
# 末端工具长度偏移(mm)，叠加在 J5→法兰面偏距(91.5)之上构成 d6。
# 不装夹爪 = 0（d6=91.5）；装夹爪按实测夹爪长填写（约 91.5 → d6=183）。
tool_length = 0
[movel]
# 弓高预算(mm)：sync 模式下"直"与"顺"的权衡旋钮，改完重启程序即生效。
#   调大 = 段数少 ⇒ 顺，但偏离笛卡尔直线更多（弓高 ∝ 段长²）
#   调小 = 段数多 ⇒ 直，但每段都要等到位 ⇒ 一顿一顿
# 整段弓高 ≤ 这个值时会自动按【一次性下发】处理，中途零停顿。
# 想强制不分段（流畅优先、接受弧线），用 movel 第 10 个参数关键字 smooth。
#
# 【⚠️ 2026-09-18 重大修正】上面那套 U 形曲线的实测数据【作废】。
# 它是被一个 bug 污染出来的假象：旧代码用【整段】每轴位移比定速，
# 但各轴速率比沿笛卡尔直线是变的 ⇒ J2/J3/J5 提前到位停住、只剩 J1/J6 走完，
# 每段都被甩成一个弓（实测 1.9mm vs 几何弓高 0.54mm，3.5 倍）。
# 修正为【按段】归一化速度（movl_set_seg_speed）后，实测≈几何弓高，曲线变单调：
#
# 【修正后实测（50mm 直线，gap=0，每档 4 趟来回）】
#     段数   几何弓高     实测最大偏差              均值
#      2     0.54 mm      0.64 / 0.44 / 0.67 / 0.42   0.54 mm
#      3     0.24 mm      0.39 / 0.20 / 0.40 / 0.25   0.31 mm
#      4     0.14 mm      0.30 / 0.18 / 0.30 / 0.25   0.26 mm
#      5     0.10 mm      0.28 / 0.19 / 0.27 / 0.20   0.235 mm
# ⇒ **段数越多越直**，不再有 U 形。5 段还剩约 0.2mm 的本底（方向相关，疑似
#   回差/齿隙：一个方向 0.18~0.20、反方向 0.27~0.32），调分段已经压不动了。
#
# 【为什么取 0.20】段数 n = ceil(位移 / L)，L = 位移 × sqrt(budget / 整段弓高)。
#   50mm、整段弓高 2.08 时：budget=0.20 ⇒ L=15.5 ⇒ n=ceil(3.23)=**4 段** ✔
# 4 段把 50mm 线的偏差从修正前的 1.88mm 压到 **0.26mm（7 倍）**，代价是中间停 3 次。
# 想更顺（只停 1 次、接受 0.54mm）：改 1.0。
# 想更直（停 4 次、0.235mm）：改 0.10 —— 只再省 0.03mm，收益已经很小。
bow_mm = 0.20

# 六轴位置【连发】的帧间延迟(ms)。>0 = 用"只写不等响应"连发；0 = 每轴等响应。
# 【⚠️ 2026-09-18 结论：连发不仅没用，还更差 —— 默认保持 0（关闭）】
# 修正速度归一化之后做了 A/B/A 三轮（每轮 4 趟 50mm 来回，bow_mm=0.20）：
#     gap=4（连发）: 0.31 0.32 0.20 0.19 | 0.31 0.18 0.27 0.20  ⇒ 均值 0.25 mm
#     gap=0（等响应）: 0.17 0.14 0.18 0.19                        ⇒ 均值 0.17 mm
# ⇒ 等响应**反而更准 32%**，而且没有撞帧风险。
# 修正【之前】的那次 A/B（1.88 vs 1.945，看着一样）是假象——当时 1.9mm 的速度
# 失配误差压倒一切，两组的差别被淹没了。教训：主误差没压下去之前别做 A/B。
#
# 为什么连发更差（推测，未证实）：不等响应 ⇒ 从站的应答帧仍会占用总线，
# 4ms 后我们发的下一帧可能和它撞在一起，被丢弃的那一轴就慢半拍。
# nrtest 静止实测（0/1/2ms 撞车、3ms 起干净）在运动工况下并不一定成立。
#
# 保留这个开关只为以后做对照。想复测：改 4 重启即可。
# nrtest 静止实测留档：0ms→一轮 6.30ms 读失败1/6  1ms→10.90ms 1/6
#                      2ms→17.10ms 1/6  3ms→21.80ms 0/6  5ms→34.40ms 0/6
noread_gap_ms = 0

[safety]
# 单次下发的位移上限（机械角度）。超过就拒绝下发，一动不动。
# 这是防"逻辑错误把垃圾目标写给驱动器"的闸门 —— 见下面【为什么需要它】。
#
# 【为什么需要它】光检查"目标是不是 NaN"不够。真机出过两次事故，目标都是
# 一个**完全合法的 int32**，只是离当前位置十万八千里：
#   ① 2026-09-18：万向锁处 asin 越界产出 NaN，转 int32 成 ±2147483647
#      ⇒ 电机朝天文数字猛冲、永不到位、超时急停，末端甩出 34mm；
#   ② 同一天另一次：脚本写 0x00E8 时高低字写反，目标变成 3.28 亿
#      （≈118000°）⇒ J5 猛冲顶死、相位过流、把电源拉垮、六轴零点全丢。
# 这类值 isfinite 挡不住，只有"离当前位置太远"能识别。
#
# 【默认 720 的依据】关节软限位最宽的是 J4/J6（±360°，全宽 720°）。
#   合法运动的起点终点都在限位内 ⇒ 单次位移不会超过全宽。取全宽恰好让
#   "任何限位内的点 → 另一个限位内的点"全部放行，同时把 118000° 挡死。
#
# 【要不要收紧】取决于你怎么用：只做小范围画图可以设到 30°、挡得更死；
#   要整圈转 J4/J6 就保持 720。这是你的取舍，代码只给默认值。
#
# 注：另有两条更靠外的闸门，不在这里配置：
#   - 目标角 NaN/Inf ⇒ 直接拒绝（cli/movej_issue 与 control/robot_movej）
#   - 目标步数 |steps| > 1e8 ⇒ 直接拒绝（api/motor_reg.c 的出口闸门，
#     对 J2 而言相当于 100 圈机械角，正常作业绝不会碰线）
max_step_deg = 720

# MoveL 规划路径里【相邻插补点之间】允许的最大单关节跳变（机械角度）。
# 超过就在规划阶段拒绝整条 MoveL —— 一动不动，并提示先用 MoveJ 把姿态挪开。
#
# 【为什么需要它】"一小段笛卡尔位移需要某个关节转一大圈"是甩臂最通用的前兆，
# 不管成因是腕部奇异、逆解分支翻转还是选解抖动，最后都长成这个样子。
# 末端位姿本身仍然是精确的，但关节会在一个段里跑完那个大角度。实测后果
# （+Y 30mm，1mm 弦）：该段被时间表按关节限速拉长到 12.5 秒，这段时间里
# 末端只挪 1mm、而 J4 转过 89.97° —— 不是「猛冲」，但臂会以你完全没预料到
# 的大幅度慢慢扫过去，肘部/法兰扫过一大片空间，撞到周围东西的概率极高，
# 而且看上去根本不像直线。
#
# 【实测基准 2026-09-18】
#   正常：home 出发沿 -Z 走 50mm（1mm 弦 ⇒ 51 点），J3 全程 21° 分 50 段
#         ⇒ 单段最大约 0.9°；
#   病态：home 出发沿 +Y 走 30mm（起点 J5=0，正踩腕部奇异）
#         ⇒ **第 1 段就要 J4 转 89.98°**。
#   差两个数量级 ⇒ 阈值取 30° 两边都留了极大余量，正常作业绝不会误伤。
#
# 【默认 30 的依据】取"正常单段（<1°）"与"病态单段（90°）"的几何中点的
#   偏保守一侧。想更严就调到 10°（代价：靠近奇异的姿态更容易被拒）；
#   想更松就调大，但超过 90° 基本等于关掉这道闸。
#
# 【注意】这条只在【规划层】拦 MoveL。MoveJ 不受它管 —— MoveJ 的目标角由
#   用户直接指定，另有"越软限位 ⇒ 拒绝"那一条管着。
max_jump_deg = 30

[stall]
# 逐轴堵转/碰撞电流阈值（mA），j1..j6 对应关节 1..6。0 = 该轴不检测。
#
# 【为什么逐轴】六轴机座大小不同、额定电流差好几倍，用同一个阈值必然
#   要么大轴一动就误报、要么小轴撞死都不报。旧设计只有单个全局值，已废弃。
#
# 【判据】立三没有堵转状态寄存器，0x001A 实时电流是唯一依据。
# 【⚠️ 当前全部为 0 = 保护关闭】，这是刻意的：没实测过就填数字，
#   要么一路误报打断运动，要么形同虚设。量完再填。
#
# 【2026-09-18 实测】curtest 量出，60rpm 摆动 ±2°，测了两种姿态：
#     轴   保持均值  ─ 运动峰值 ─        建议区间(峰值×1.5~×2.0)
#               (Z=140 姿态 / home 姿态)
#     J1     502      503 / 504         754 ~ 1008
#     J2     499      504 / 508         756 ~ 1016
#     J3     499      506 / 503         754 ~ 1012
#     J4     376      382 / 379         568 ~  764
#     J5     375       -- / 378         567 ~  756
#     J6     249      268 / 254         381 ~  536
#   大轴 ~500mA、J4/J5 ~374mA、J6 ~250mA —— 差距正好说明为什么要逐轴配置。
#
#   ★ 两种姿态的峰值差异 <5% ⇒ 保持电流主要由驱动器的"空闲电流 25%"
#     （0x000E）决定，跟负载/姿态关系不大。阈值按上表定即可，不用管姿态。
#
#   ⚠️ J5 首次测量失败的原因已查明：当时它一动就「相位过流」报警（0x00A3=1），
#      驱动器切断输出 ⇒ 采到的 0~20mA 是假数据（这就是给 curtest 加"到位核查
#      + 报警回读"的原因）。**回零后重测 J5 = 378mA，与 J4 一致，完全正常**。
#      ⇒ 那次过流是当时未知姿态下的偶发机械干涉，不是硬件损坏。
#
# 运行时也能改：stall:N:MA（只改本次运行，不写 ini）。
# 2026-09-18 用户选定【保守档 = 实测运动峰值 × 2.0】：
#   J1/J2/J3 = 1000（峰值 ~505，额定 2.00A 的 50%）
#   J4/J5    =  760（峰值 ~379，额定 1.50A 的 51%）
#   J6       =  510（峰值 ~254，额定 1.00A 的 51%）
# 留 2 倍余量 ⇒ 正常运动不会误报，只有真堵转/碰撞才触发。
# 想更早触发改 ×1.5：756,762,754,568,567,381
j1 = 1000
j2 = 1000
j3 = 1000
j4 = 760
j5 = 760
j6 = 510

