[serial]
port = COM4
baudrate = 921600
[tool]
# 末端工具长度偏移(mm)，叠加在 J5→法兰面偏距(91.5)之上构成 d6。
# 不装夹爪 = 0（d6=91.5）；装夹爪按实测夹爪长填写（约 91.5 → d6=183）。
tool_length = 0
# 笔长(mm)：【只影响告警文案，不改任何坐标】。movel 的目标姿态跟当前姿态不一致时，
# 程序用它把"偏差 88.9°"换算成"笔尖要绕法兰摆 57.6mm"这句人话。
# 41.17 是实测反推值：绘图位姿法兰 Z=155.17，笔尖接触纸面时法兰 Z=114 ⇒ 差 41.17。
# 有卡尺就量一下法兰面到笔尖的实际距离再填。填 0 则只提示角度、不算毫米数。
pen_length = 41.17
[telemetry]
# UDP 遥测：把每次下发的六轴目标角发给本机，3D 镜像（sim/live_mirror.py）实时跟着动。
# 走 127.0.0.1 回环，sendto 是微秒级非阻塞操作；**没人监听时内核直接丢包**，
# 所以不开 Python 也毫无副作用。所有失败路径静默禁用，不会影响机械臂控制。
#
# 想关掉（比如做总线时序标定、不想有任何额外系统调用）：把 enabled 改 0。
enabled = 1
port = 9900

[movel]
# 弓高预算(mm)：sync 模式下"段数↔弓高"的权衡旋钮，改完重启程序即生效。
#
# 【★★ 2026-09-19 AI 实测：100mm Y 向线，绘图位姿，30rpm，三档对比】
#      模式          段数   步长     预测弓高   实测最大偏差   段间停顿
#      smooth          1    100.0mm    8.73      8.70 mm       0     ← 最顺，弯 8.7%
#   ★ sync(bow 2.0)    3     33.3mm    1.03      1.04 mm       2     ← 折中：1%，停 2 次
#      step          101      1.0mm      —       0.02 mm     100     ← 最直，但一顿一顿
#   ⇒ **【直】与【顺】不可兼得，这是实测坐实的。** 上一版写的"smooth 又直又顺"
#     是错的（那次 smooth 根本没生效，见下），已作废。
#   ⇒ 画 100mm 线推荐 **sync（默认，bow_mm=2.0）**：1mm 弯在 100mm 线上是 1%，
#     肉眼基本看不出，只停 2 次；要量尺寸就上 step；只想看流畅度才用 smooth。
#
# 【⚠️ 2026-09-19 修 bug：smooth 模式此前【根本没生效】，一直是死代码】
#   commands.c 里"按弓高预算定段数"的整块只在 `movl_mode == SYNC` 时进入，
#   而块内的 `if (SMOOTH) target_n = 1` 因此**永远不可达** ⇒ SMOOTH 掉到后面的
#   step 路径，被切成 101 段；打印又把 sync/smooth 一律显示成"模式 step"，
#   三重误导，排查时差点被它带偏。已修：入口条件加上 SMOOTH，模式名打印补齐。
#   ⇒ 教训：**新增一个模式关键字后，必须验证它真的改变了行为**（看段数/耗时），
#     别只看"命令解析成功 / 没报错"。
#
# 【✅ 弓高预测其实是准的（本次实测，推翻"预测不可信"的说法）】
#   smooth：预测 8.73 / 实测 8.70（差 0.3%）；sync：预测 1.03 / 实测 1.04（差 1%）。
#   之前记的"预测错三次"要修正 —— 错的是拿它去预测【多段】运动的实测偏差：
#   分段会额外引入段间启动差误差，那是预测模型里没有的项。
#   ⇒ 在【单段 / 少段】下预测很准，可以放心用它选段数。
#
# 【卡顿的真正根因：驱动器每段收到新目标后独立做一次加减速，段末速度归零】
#   movej / smooth = 单段 ⇒ 只 1 次启动/停止 ⇒ 流畅；
#   movel 分 N 段 ⇒ N 次"减速到 0 → 等下发 → 重新加速" ⇒ 就是那一卡一卡。
#   **决定性反例**：stream 在【程序层面】已经零停顿（实际/预计 = 1.007），
#   用户照样觉得卡 ⇒ "程序不停顿" ≠ "物理不停顿"。
#   ⇒ 别再盯着程序里的 Sleep / 等待时间去查卡顿，段数才是那个 N。
#
# 【以下 history 段（过流检查 / 降速 / stream）是排查过程记录，结论已被上面取代】
#   过流检查只是【放大器】不是根因：它每节拍读 6 轴电流，把节拍从 502ms 撑到
#   685ms ⇒ 每段干等 183ms。实测 100mm 线（28 段）：
#       过流【开】：实际 19.19 s / 预计 14.06 s（超 36%）
#       过流【关】：实际 13.95 s / 预计 13.85 s（差 0.7%）
#   关法：运行时 `stall:1:0` … `stall:6:0`（重启恢复 ini 值）。代价：失去碰撞保护。
#   **判据：实际耗时 ÷ 预计耗时 越接近 1 越流畅** —— 这个差值就是"停顿"的度量。
#   ⚠️ 降速没用：15rpm 时段数变 56、预计 28.24s，但每段实际仍是 0.685s，
#      与 30rpm 一模一样 —— 段时长由节拍决定，速度只改变段数。
#   ⚠️ 程序提示"节拍超过段时长 25% ⇒ 六轴起步严重不同步"是误导：
#      实测偏差只有 0.03~0.06mm，各轴压根没不同步。
#   【待做】过流检查降频：每 N 个节拍查一次而不是每节拍查，开销降到 1/N。
#
# 【⚠️ 2026-09-18 重大修正】上面那套 U 形曲线的实测数据【作废】。
# 它是被一个 bug 污染出来的假象：旧代码用【整段】每轴位移比定速，
# 但各轴速率比沿笛卡尔直线是变的 ⇒ J2/J3/J5 提前到位停住、只剩 J1/J6 走完，
# 每段都被甩成一个弓（实测 1.9mm vs 几何弓高 0.54mm，3.5 倍）。
# 修正为【按段】归一化速度（movl_set_seg_speed）后，实测≈几何弓高，曲线变单调：
#
# 【修正后实测（50mm 直线，gap=0，每档 4 趟来回）】
#     段数   几何弓高     实测最大偏差              均值
#      2     0.54 mm      0.64 / 0.44 / 0.67 / 0.42   0.54 mm
#      3     0.24 mm      0.39 / 0.20 / 0.40 / 0.25   0.31 mm
#      4     0.14 mm      0.30 / 0.18 / 0.30 / 0.25   0.26 mm
#      5     0.10 mm      0.28 / 0.19 / 0.27 / 0.20   0.235 mm
# ⇒ **段数越多越直**，不再有 U 形。5 段还剩约 0.2mm 的本底（方向相关，疑似
#   回差/齿隙：一个方向 0.18~0.20、反方向 0.27~0.32），调分段已经压不动了。
#
# 【为什么取 0.20】段数 n = ceil(位移 / L)，L = 位移 × sqrt(budget / 整段弓高)。
#   50mm、整段弓高 2.08 时：budget=0.20 ⇒ L=15.5 ⇒ n=ceil(3.23)=**4 段** ✔
# 4 段把 50mm 线的偏差从修正前的 1.88mm 压到 **0.26mm（7 倍）**，代价是中间停 3 次。
# 想更顺（只停 1 次、接受 0.54mm）：改 1.0。
# 想更直（停 4 次、0.235mm）：改 0.10 —— 只再省 0.03mm，收益已经很小。
# 【2026-09-19 用户拍板：取 2.0】这是给【sync 模式】留的默认值。
#   段数 n = ceil(位移 / L)，L = 位移 × sqrt(budget / 整段弓高)。
#   100mm Y 向线档位（表中"弯量"是【几何弓高预测】，已被证明不可信，只作相对参考）：
#       budget   段数   步长     预测弓高   实测偏差    停顿
#       5.0        2    50.0mm    2.17      （未测）    1
#     ★ 2.0        3    33.3mm    1.03      **1.04mm**  2   ← 推荐
#       1.0        4    25.0mm    0.54      （未测）    3
#       0.20       7    14.3mm    0.18      （未测）    6
#       smooth     1   100.0mm    8.73      **8.70mm**  0
#       step     101     1.0mm      —       **0.02mm** 100
#   ⇒ 结论：段数从 101 降到 3，实测偏差只从 0.02mm 涨到 **1.04mm**（1%），
#     而停顿从 100 次降到 2 次 —— 这笔交易非常划算。降到 1 段（smooth）则
#     偏差跳到 8.70mm，肉眼可见的弧，不划算。所以折中点就停在 3 段。
#
# ⚠️⚠️ 2026-09-23 用户拍板：MoveL 【默认模式已改为 smooth（不分段）】⚠️⚠️
#   原话："我是默认不分航点，分航点就很诡异的，跑的一卡一卡的。
#           市面上的机械臂都不会跑的一卡一卡的。"
#   实测依据：每段末速度归零 + 每段 0.33~0.61s 的段间停顿 ⇒ 3 段就是"卡三下"。
#   ⇒ 现在不带 MODE 的 movel 一律【整段一次下发】，零段间停顿。
#   ⇒ **bow_mm 只在【显式写 ,sync】时才生效**，改它而命令里没有 sync 是没用的。
#   需要直线精度时：movel:X,Y,Z,SPD,ACC,DEC,keep,sync（此时才按 bow_mm 分段）
#   ⚠️ 安全代价：不分段 ⇒ 运动全程不执行过流(碰撞)检查；要保护就用 ,sync。
bow_mm = 2.0

# ============================================================================
# 卡顿调节三旋钮（2026-09-23 新增）
#
# 【背景 —— 卡顿的物理根因，已实测坐实，别再往程序停顿上找】
#   驱动器【每段收到新绝对目标都会独立做一次加减速、段末速度归零】。
#   决定性反例：stream 在【程序层面】已经零停顿（实际/预计 = 1.007），
#   用户照样觉得卡 ⇒ "程序不停顿" ≠ "物理不停顿"。段数 N 就是归零次数 N。
#   ⇒ 卡顿的量化描述：【段间速度凹陷：深度=全速、宽度≈ACC+DEC、次数=段数-1】。
#
# 【能拧什么】在"多段才直"的前提下减轻顿挫，只有一条路：把凹陷变浅变窄 ——
#   减小 ACC/DEC ⇒ 段长下限（= seg_ramp_ratio ×(ACC+DEC)）跟着降 ⇒ 段数自然变多，
#   于是"3 次深而宽的凹陷"变成"十几次浅而窄的凹陷"。
#   注意：这不能消除凹陷，只是把每次的幅度压到人不易察觉。
#   要【完全无凹陷】只有 1 段（smooth 模式），代价是弓高（100mm 线 8.7mm）。
#
# 【代价】ACC/DEC 过短会丢步，表现为"走到一半卡住"或到位误差变大。必须实测。
# 【默认值与新增前完全相同】⇒ 下面三行删掉不配，行为一字不变，零回归风险。
# ============================================================================

# 加/减速时间下限(ms)：命令里传的 ACC/DEC 小于它就抬到它。默认 60。
# 想试更顺的段间过渡：改 15 或 20。配合 seg_ramp_ratio=3.0 ⇒ 段长下限 90~120ms
# （原来是 360ms），同样长度的运动段数变 3~4 倍，每次凹陷从 ~120ms 压到 ~30ms。
acc_floor_ms = 60

# 段时长下限 = 本值 ×(ACC+DEC)。防"段比加减速还短 ⇒ 每段都在刹车+重新爬坡"。
# 默认 3.0。调小 ACC 后若还想让段数更多，可降到 2.0~2.5；
# 低于 1.5 时几乎全程都在加减速，速度上不去，别用。
seg_ramp_ratio = 3.0

# stream 模式的目标节拍(s)。实际段时长 = max(本值, seg_ramp_ratio×(ACC+DEC))。
# 默认 0.10。仅在 movel 命令加 ,stream 时生效。
stream_beat_s = 0.10

# 六轴位置【连发】的帧间延迟(ms)。>0 = 用"只写不等响应"连发；0 = 每轴等响应。
# 【⚠️ 2026-09-18 结论：连发不仅没用，还更差 —— 默认保持 0（关闭）】
# 修正速度归一化之后做了 A/B/A 三轮（每轮 4 趟 50mm 来回，bow_mm=0.20）：
#     gap=4（连发）: 0.31 0.32 0.20 0.19 | 0.31 0.18 0.27 0.20  ⇒ 均值 0.25 mm
#     gap=0（等响应）: 0.17 0.14 0.18 0.19                        ⇒ 均值 0.17 mm
# ⇒ 等响应**反而更准 32%**，而且没有撞帧风险。
# 修正【之前】的那次 A/B（1.88 vs 1.945，看着一样）是假象——当时 1.9mm 的速度
# 失配误差压倒一切，两组的差别被淹没了。教训：主误差没压下去之前别做 A/B。
#
# 为什么连发更差（推测，未证实）：不等响应 ⇒ 从站的应答帧仍会占用总线，
# 4ms 后我们发的下一帧可能和它撞在一起，被丢弃的那一轴就慢半拍。
# nrtest 静止实测（0/1/2ms 撞车、3ms 起干净）在运动工况下并不一定成立。
#
# 保留这个开关只为以后做对照。想复测：改 4 重启即可。
# nrtest 静止实测留档：0ms→一轮 6.30ms 读失败1/6  1ms→10.90ms 1/6
#                      2ms→17.10ms 1/6  3ms→21.80ms 0/6  5ms→34.40ms 0/6
noread_gap_ms = 0
[safety]
# 单次下发的位移上限（机械角度）。超过就拒绝下发，一动不动。
# 这是防"逻辑错误把垃圾目标写给驱动器"的闸门 —— 见下面【为什么需要它】。
max_step_deg = 720
max_jump_deg = 30

[stall]
# 逐轴堵转/碰撞电流阈值（mA），j1..j6 对应关节 1..6。0 = 该轴不检测。
#
# 【为什么逐轴】六轴机座大小不同、额定电流差好几倍，用同一个阈值必然
#   要么大轴一动就误报、要么小轴撞死都不报。旧设计只有单个全局值，已废弃。
#
# 【判据】立三没有堵转状态寄存器，0x001A 实时电流是唯一依据。
#
# 【2026-09-18 实测】curtest 量出，60rpm 摆动 ±2°，测了两种姿态：
#     J1 峰值 503/504 → 1000　　J2 504/508 → 1000　　J3 506/503 → 1000
#     J4 382/379 → 760　　　　　J5 378 → 760　　　　 J6 268/254 → 510
#   ★ 两种姿态峰值差 <5% ⇒ 保持电流主要由驱动器"空闲电流 25%"（0x000E）决定，
#     与负载/姿态关系不大，阈值按上表定即可。
#
# 运行时也能改：stall:N:MA（只改本次运行，不写 ini）。
# 2026-09-18 用户选定【保守档 = 实测峰值 × 2.0】：正常运动不误报，真堵转才触发。
#
# 【⚠️ 2026-09-21】这一段丢过两次：先是被误删，第二次是 ini_write_joint_zero
#   的固定 8192 字节缓冲把文件后半截静默截断（ini 已 8403 字节）⇒ 每次 zero_save
#   都会把它删掉，表现为"过流保护莫名关闭"。缓冲已改为动态分配，本段可安全保留。
j1 = 1000
j2 = 1000
j3 = 1000
j4 = 760
j5 = 760
j6 = 510

[joint_zero]
q0 = -176.70
q1 = 74.60
q2 = -180.07
q3 = 4.29
q4 = 113.67
q5 = 84.89
