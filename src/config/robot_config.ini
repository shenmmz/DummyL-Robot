[serial]
port = COM4
baudrate = 921600

[tool]
tool_length = 0
pen_length = 41.17

[telemetry]
enabled = 1
port = 9900

[movel]
; 加/减速安全下限(ms)：movel 尾部写的 ACC/DEC 低于此值会被抬高。减速窗是段间停顿主体，
; 40=激进档（真机丢步则改回 60）；驱动器已验证稳跑 80/90
acc_floor_ms = 40
; interp 逐点插补的【偏差预算】(mm)：屏幕"单段弓高"与实测峰值偏差的允许上限。
; 程序按 步长=sqrt(预算/0.001) 自动反推航点密度：预算越大→步长越大→航点越少→段间停顿越少（但直线度变差）。
; 参考：0.4=当前(步长20mm/最稳)，0.8=步长28mm，1.5=步长39mm。删掉本行则退回下面的 step_mm。
max_bow_mm = 0.4
; interp 逐点插补步长(mm)兜底：仅在未配 max_bow_mm 时生效；越小越贴直线但越慢
step_mm = 20

[safety]
max_step_deg = 720

max_jump_deg = 360

[stall]
j1 = 1000
j2 = 1000
j3 = 1000
j4 = 760
j5 = 760
j6 = 510

[joint_zero]
q0 = -176.70
q1 = 74.60
q2 = -180.07
q3 = 4.29
q4 = 113.67
q5 = 84.89
