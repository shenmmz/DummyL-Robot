[serial]
port = COM4
baudrate = 921600

[tool]
tool_length = 0
pen_length = 41.17

[telemetry]
enabled = 1
port = 9900

[movel]
; 加/减速安全下限(ms)：movel 尾部写的 ACC/DEC 低于此值会被抬高。减速窗是段间停顿主体，
; 40=激进档（真机丢步则改回 60）；驱动器已验证稳跑 80/90
acc_floor_ms = 40
; interp 逐点插补的【偏差预算区间】(mm)：程序取【弓高中点 (min+max)/2】作折中预算，
; 再按 步长=sqrt(预算/0.001) 反推航点密度（预算越大→步长越大→航点越少→段间停顿越少，但直线度变差）。
; 例：0.1~0.5 ⇒ 折中 0.3 ⇒ 步长≈17mm。想更少航点/更顺就把两值整体抬高（如 0.3~0.8⇒中点0.55⇒步长23mm）。
; 只留 max_bow_mm 不配 min_bow_mm ⇒ 直接用上限（旧行为）。删掉这两行则退回 step_mm。
min_bow_mm = 0.1
max_bow_mm = 0.5
; interp 逐点插补步长(mm)兜底：仅在未配 max_bow_mm 时生效；越小越贴直线但越慢
step_mm = 20

[safety]
max_step_deg = 720

max_jump_deg = 360

[stall]
j1 = 1000
j2 = 1000
j3 = 1000
j4 = 760
j5 = 760
j6 = 510

[joint_zero]
q0 = -176.70
q1 = 74.60
q2 = -180.07
