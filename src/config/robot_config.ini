[serial]
port = COM4
baudrate = 921600

[tool]
tool_length = 0
pen_length = 41.17

[telemetry]
enabled = 1
port = 9900

[movel]
; acc_floor_ms = ACC/DEC 的安全下限(ms)。低于它会被抬上来（过短减速会丢步）。
acc_floor_ms = 60

[safety]
max_step_deg = 720
; 【临时放开】smooth 模式不做插补(只起点+终点两段)，单段跳变=整条运动的总关节量，
; 30° 会误杀合法的大幅度运动(如纯 Z 下降需 J3 扫 ~46°)。先抬到 360 让臂能动，
; 仅保留软限位 + NaN 防线 + 堵转急停兜底；15° 以上的告警仍会打印。
; 要恢复"奇异/分支翻转防甩臂"硬拦，把它改回 30。
max_jump_deg = 360

[stall]
