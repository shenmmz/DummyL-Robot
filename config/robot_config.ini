; ============================================================
; DummyL-Robot 运行时可调参数
; 格式: 每行 key = value，分号开头为注释
; 修改后重启程序生效（无需重新编译）
; ============================================================

[serial]
; Windows 串口设备名（USB 转 RS485 对应端口，设备管理器中确认）
port = COM3
; 波特率 115200 8N1（Zeta 电机出厂默认）
baudrate = 115200
data_bits = 8
parity = N
stop_bits = 1

[motion]
; 默认运动速度（rpm，寄存器 0x13 目标速度，每次上电读取 0xE7 默认值）
default_speed_rpm = 3000
; 默认加速度（rpm/s，寄存器 0x14，0-30000）
default_accel = 10000
; 默认到位精度（步，寄存器 0x15）
default_precision = 100

[modbus]
; Modbus 从站地址出厂默认值（手册 P14 寄存器 0x00E0，出厂 00 01 = 1；
; 多台电机需分别写 0x00E0 修改地址，运行时各关节地址见 robot_config.h 的
; ROBOT_SLAVE_ADDR_TABLE）
slave_addr_default = 1
; Modbus 主站轮询间隔（ms）
poll_interval_ms = 50
; 单次请求超时（ms）
request_timeout_ms = 200

[safety]
; 堵转电流出厂默认（mA，手册 P14 寄存器 0x00E1 出厂 0x0BB8 = 3000mA，
; 驱动电流范围为 0~3000mA；六轴差异化阈值待实机标定）
stall_current_ma = 3000
; 堵转时间（ms，手册 P15 寄存器 0x00E6 出厂 0，需实机整定后填写）
; stall_time_ms = 0
; 限位开关使能（手册 P13 寄存器 0x0008 出厂 00 01 = 1 起作用）
limit_switch_enable = 1

[tools]
; scan_motors: 扫描的从站地址范围（含端点）
scan_addr_begin = 1
scan_addr_end = 16
