; ============================================================
; DummyL-Robot 运行时可调参数
; 格式: 每行 key = value，分号开头为注释
; 修改后重启程序生效（无需重新编译）
; ============================================================

[serial]
; Windows 串口设备名（USB 转 RS485 对应端口，设备管理器中确认）
port = COM4
; 波特率 115200 8N1（立三 LEESN 电机出厂默认，手册 V126）
baudrate = 115200
data_bits = 8
parity = N
stop_bits = 1

[motion]
; 默认运动速度（rpm；写入立三 0x00D8~0x00D9 运行速度 INT32，单位 0.01 rpm，
; 出厂默认 30000 = 300 rpm；0x009A 为 SV113 以下固件的 UINT16 速度寄存器）
default_speed_rpm = 3000
; 默认加减速时间（ms；立三 0x0098 加速时间、0x0099 减速时间，出厂默认 120ms）
; 注：立三无"加速度 rpm/s"寄存器，此值与加速度换算关系待实机整定
default_accel = 10000
; 默认到位精度（步；立三无专用到位精度寄存器，到位由状态字 0x0006 bit12 判断，
; 此值保留仅供上层精度统计参考）
default_precision = 100
; 六轴减速比（关节1..6；与 robot_config.h ROBOT_REDUCTION_TABLE 对应，
; 1/3/4/5/6=50:1，2 号=100:1 且默认屏蔽）
reduction_1 = 50
reduction_2 = 100
reduction_3 = 50
reduction_4 = 50
reduction_5 = 50
reduction_6 = 50
; 关节屏蔽表（1=屏蔽；2 号未安装默认屏蔽，安装后改 0）
joint_mask_1 = 0
joint_mask_2 = 1
joint_mask_3 = 0
joint_mask_4 = 0
joint_mask_5 = 0
joint_mask_6 = 0

[modbus]
; Modbus 基地址出厂默认值（手册 V126 寄存器 0x0066 基地址，出厂 1；
; 多台电机需分别写 0x0066 修改地址，运行时各关节地址见 robot_config.h 的
; ROBOT_SLAVE_ADDR_TABLE）
slave_addr_default = 1
; 六轴从站地址（关节1..6，与驱动器基地址 0x0066 一一对应；2 号默认屏蔽）
slave_addr_1 = 1
slave_addr_2 = 2
slave_addr_3 = 3
slave_addr_4 = 4
slave_addr_5 = 5
slave_addr_6 = 6
; 波特率码（立三 0x0009 低 8 位；出厂 12 = 115200，与 [serial] baudrate 配套）
baudrate_code = 12
; Modbus 主站轮询间隔（ms）
poll_interval_ms = 50
; 单次请求超时（ms）
request_timeout_ms = 200

[safety]
; 堵转电流初始参考（mA，立三无专用堵转电流寄存器；0x001A 为实时电流只读，
; 堵转判定由 home.c 回零时读 0x001A 实测对比，六轴差异化阈值待实机标定）
stall_current_ma = 3000
; 六轴差异化电流阈值（关节1..6，单位 mA；2 号默认屏蔽）
stall_current_ma_1 = 3000
stall_current_ma_2 = 3000
stall_current_ma_3 = 3000
stall_current_ma_4 = 3000
stall_current_ma_5 = 3000
stall_current_ma_6 = 3000
; 堵转时间（ms，立三无对应寄存器，由 home.c 回零逻辑按采样窗口判断）
; stall_time_ms = 0
; 限位开关有效（立三 0x006D 限位有效寄存器，默认值待实机确认；
; 软件限位为 0x006E~0x006F 负限位 / 0x0070~0x0071 正限位 INT32）
limit_switch_enable = 1

[limits]
; 各关节软限位角度（度，min/max 对；与 robot_config.h ROBOT_SOFT_LIMIT_TABLE_DEFAULT
; 对应，换算为脉冲限位需实机确认；2 号默认屏蔽）
soft_limit_1_deg = -170, 170
soft_limit_2_deg = -170, 170
soft_limit_3_deg = -170, 170
soft_limit_4_deg = -170, 170
soft_limit_5_deg = -170, 170
soft_limit_6_deg = -170, 170

[tools]
; scan_motors: 扫描的从站地址范围（含端点）
scan_addr_begin = 1
scan_addr_end = 16
